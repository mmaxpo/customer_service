[project]
name = "backend"
version = "0.1.0"
description = "Agentic backend (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "orjson",
  "python-dotenv",
  "httpx",
  "PyJWT",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pgvector",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "langchain",
  "langchain-core",
  "langchain-openai",
  "psycopg[binary]",
  "langchain-postgres",
  "pydantic[email]>=2.12.5",
  "passlib[argon2,bcrypt]>=1.7.4",
  "python-multipart>=0.0.22",
  "pypdf>=6.0.0",
  "boto3>=1.42.0",
  "argon2-cffi>=25.1.0",
  "sentence-transformers>=5.2.2",
  "torch>=2.10.0",
  "langchain-text-splitters>=1.1.0",
  "fastmcp>=2.14.5",
  "mcp[cli]>=1.26.0",
  "langchain-mcp-adapters>=0.2.1",
  "croniter>=6.0.0",
  "resend>=2.30.1",
  "redis[hiredis]>=7.1.0",
  "sentry-sdk[fastapi]>=2.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
